<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Cup 2026 — Prediction Market</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">⚽ <span>World Cup 2026</span> · Prediction Market</div>
    <div class="bal">Balance <b id="bal">$50.00</b></div>
  </header>

  <main>
    <p class="tag">Will the home side win? Buy <span class="yes">YES</span> or <span class="no">NO</span> — prices move with the crowd.</p>
    <div id="board" class="board"></div>
  </main>

  <footer class="foot">3 microservices · markets · trading · settlement — running in a secure <b>islo</b> sandbox</footer>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
